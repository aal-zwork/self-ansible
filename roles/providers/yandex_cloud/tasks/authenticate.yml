---
# ADM's instance already runs under an admin-privileged service account
# (confirmed by the user), so `yc` authenticates automatically against the
# instance metadata service — no credential needs to be provisioned here.
# This task only verifies that assumption holds; it must never try to
# create or store a yc auth secret itself.
#
# Pin yc's default cloud/folder explicitly to this environment's values
# FIRST — otherwise the actual-API-call check below could succeed against
# the wrong cloud/folder if the ambient profile defaults elsewhere.
# Genuinely idempotent: only run `yc config set` (and report changed) if
# the current value actually differs — not `changed_when: true`
# unconditionally.
- name: Read current yc default cloud-id
  ansible.builtin.command: yc config get cloud-id
  register: yc_current_cloud_id
  changed_when: false
  failed_when: false

- name: Pin yc default cloud-id for this environment
  ansible.builtin.command: yc config set cloud-id {{ yc_cloud_id }}
  when: yc_current_cloud_id.stdout | trim != yc_cloud_id

- name: Read current yc default folder-id
  ansible.builtin.command: yc config get folder-id
  register: yc_current_folder_id
  changed_when: false
  failed_when: false

- name: Pin yc default folder-id for this environment
  ansible.builtin.command: yc config set folder-id {{ yc_folder_id }}
  when: yc_current_folder_id.stdout | trim != yc_folder_id

# Don't parse `yc config list` text output — its exact wording for
# instance-SA auth (no explicit token/profile) isn't guaranteed. Instead,
# make a real, cheap, read-only API call and check it actually succeeds.
- name: Verify yc can reach the Yandex Cloud API using the instance SA
  ansible.builtin.command: yc resource-manager folder get {{ yc_folder_id }}
  register: yc_auth_check
  changed_when: false
  failed_when: false

- name: Fail loudly if yc cannot authenticate
  ansible.builtin.fail:
    msg: >-
      yc could not reach the Yandex Cloud API (folder {{ yc_folder_id }}):
      {{ yc_auth_check.stderr }}
      This role assumes ADM's instance service account is already
      admin-privileged; if that is not the case, this is an infrastructure
      gap outside this repo's scope — do not work around it by storing a
      yc auth secret here.
  when: yc_auth_check.rc != 0

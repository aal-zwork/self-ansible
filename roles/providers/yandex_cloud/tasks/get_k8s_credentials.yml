---
# Called by roles/k8s_cluster_access/ with `cluster_id` and
# `kubeconfig_dest` set. Writes kubeconfig into the ephemeral session
# runtime dir (tmpfs) — never into ~/.kube/config.

- name: Ensure cluster_id is provided
  ansible.builtin.assert:
    that:
      - cluster_id is defined
      - kubeconfig_dest is defined

- name: Fetch kubeconfig for the managed Kubernetes cluster
  ansible.builtin.command: >
    yc managed-kubernetes cluster get-credentials
    --id {{ cluster_id }}
    --external
    --kubeconfig {{ kubeconfig_dest }}
  changed_when: true

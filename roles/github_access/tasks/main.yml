---
# Repositories are public and ADM only ever reads them (clone/pull) — write
# access happens only from the operator's own machine (mac), outside this
# infra entirely. No credential/deploy-key/PAT is needed here: public repos
# clone over plain https without authentication.

- name: Clone configured GitHub repositories (ansible/secrets/skills)
  ansible.builtin.git:
    repo: "{{ item.clone_url }}"
    dest: "{{ item.dest }}"
    update: true
  loop: "{{ github_repos }}"
  loop_control:
    label: "{{ item.name }}"

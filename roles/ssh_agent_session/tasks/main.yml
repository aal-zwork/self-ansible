---
- name: Ensure systemd --user dir exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.config/systemd/user"
    state: directory
    mode: "0700"

- name: Template per-session ssh-agent systemd unit
  ansible.builtin.template:
    src: ssh-agent.service.j2
    dest: "/home/{{ ansible_user }}/.config/systemd/user/ssh-agent.service"
    mode: "0644"

- name: Reload systemd user units
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true

# ssh-add of actual keys happens in session_open.yml, not here — this role
# only wires up the agent process itself.

---
# Pulls secrets out of pass into tmpfs for the current session. Run this
# after bootstrap.yml, and again any time a new interactive session starts.
#
# GitHub repos (ansible/secrets/skills) are public and read-only from ADM —
# no deploy-key/PAT to load into ssh-agent (see github_access role).
- hosts: adm_machines
  gather_facts: true
  roles:
    - ephemeral_runtime_dir
    - github_access
    - k8s_cluster_access

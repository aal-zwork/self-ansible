---
# Pinned tool versions — bumped only via `make upgrade`.
yc_cli_version: "latest"      # TODO: pin to an exact version once validated on real ADM
kubectl_version: "latest"     # TODO: pin, must track cluster's k8s minor version
helm_version: "latest"        # TODO: pin

# Managed Kubernetes cluster id (Yandex Cloud).
k8s_cluster_id: "catojj5jb2nrckl04joo"

# S3 bucket/prefix used as the pass-store git remote and for disaster
# recovery artifacts. Bucket itself is created/owned outside this repo.
pass_store_s3_bucket: "ganievrf-self"
pass_store_s3_prefix: "pass-store"

# Local path on ADM where the (encrypted) pass-store git checkout lives.
pass_store_local_path: "/home/{{ ansible_user }}/.password-store"

# GitHub repositories this ADM checks out for its own operation.
github_repos:
  - name: ansible
    clone_url: "git@github.com:CHANGEME/adm-ansible.git"
    dest: "/home/{{ ansible_user }}/src/adm-ansible"
  - name: secrets
    clone_url: "git@github.com:CHANGEME/adm-secrets.git"
    dest: "/home/{{ ansible_user }}/src/adm-secrets"
  - name: skills
    clone_url: "git@github.com:CHANGEME/adm-skills.git"
    dest: "/home/{{ ansible_user }}/src/adm-skills"

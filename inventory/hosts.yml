---
# Environment is the top-level grouping (environment -> provider is 1:1,
# see ../../docs/provider-abstraction.md). "adm_machines" is a role group
# nested under the environment, not a standalone top-level group — this is
# what lets group_vars/<environment-name>.yml carry the environment's
# identity (yc_cloud_id/folder_id, S3 bucket, k8s cluster list) and have it
# apply uniformly to every ADM replica in that environment.
#
# Adding a second ADM replica to "first": add another host under
# first.children.adm_machines.hosts with its own ansible_host ssh alias —
# no code changes needed (per-host SA resolution is already dynamic, see
# secrets/providers/yandex_cloud/update-secrets.sh).
#
# Adding a new environment: add a sibling of "first" here plus a matching
# group_vars/<name>.yml — see docs/provider-abstraction.md.
all:
  children:
    first:
      children:
        adm_machines:
          hosts:
            adm:
              ansible_host: yandex-cloud-adm
